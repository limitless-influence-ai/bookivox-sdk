[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bookivox"
version = "0.1.0"
description = "Official Python SDK and CLI for the Bookivox API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["bookivox", "voice", "ai", "sdk", "workflows", "telephony"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://bookivox.com"
Documentation = "https://docs.bookivox.com"

[project.scripts]
bookivox = "bookivox_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookivox_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/bookivox_sdk/py.typed" = "bookivox_sdk/py.typed"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]
